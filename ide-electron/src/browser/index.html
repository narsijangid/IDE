<!DOCTYPE html>
<html>
  <head>
    <script>
      const theme = localStorage.getItem('theme');
      try {
        const themeObj = JSON.parse(theme);
        if (themeObj.editorBackground) {
          document.documentElement.style.backgroundColor = themeObj.editorBackground;
        }
      } catch (e) {
        // do nothing
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/olkil-logo.png" />
    <title>OLKIL</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background-color: #0a0a0a;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0a0a;
        color: #ffffff;
        transition: opacity 420ms ease;
        -webkit-app-region: drag;
        user-select: none;
      }

      #loading video {
        width: 148px;
        height: 148px;
        object-fit: contain;
        display: block;
        background: transparent;
      }

      #loading .brand {
        margin: 0;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 0.28em;
        color: #ffffff;
        text-indent: 0.28em;
        line-height: 1;
      }

      #main {
        display: flex;
        height: 100%;
        width: 100%;
        background: transparent;
      }

      .loading-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading" aria-label="Loading OLKIL">
      <video
        src="./assets/olkil.mp4"
        width="148"
        height="148"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
        disablepictureinpicture
        aria-hidden="true"
      ></video>
      <p class="brand">OLKIL</p>
    </div>
    <div id="main"></div>
  </body>
</html>
