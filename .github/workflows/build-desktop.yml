# Build OLKIL installers (Windows / macOS / Linux) and attach to a GitHub Release.
#
# Tag push:  git tag v1.3.13 && git push origin v1.3.13
# Manual:    Actions → Build desktop → Run workflow
name: Build desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Product version (e.g. 1.3.13). Empty = product.json'
        required: false
        default: ''
      publish_release:
        description: 'Create/update GitHub Release and upload installers'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arches: x64
          - os: macos-latest
            platform: darwin
            arches: arm64,x64
          - os: ubuntu-latest
            platform: linux
            arches: x64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ide-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: ide-electron/yarn.lock

      - name: Resolve version
        shell: bash
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=$(node -p "require('./product.json').version")
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Apply product version
        shell: bash
        run: |
          export PRODUCT_VERSION="${{ steps.ver.outputs.version }}"
          node scripts/apply-product.js

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Rebuild native modules
        run: yarn rebuild-native
        continue-on-error: true

      - name: Download extensions
        run: yarn download-extension
        continue-on-error: true

      - name: Stage env (optional)
        run: yarn stage-olkil-env
        continue-on-error: true
        env:
          POOLSIDE_API_KEY: ${{ secrets.POOLSIDE_API_KEY }}

      - name: Build + pack
        run: yarn build-prod && node build/pack.js
        env:
          TARGET_PLATFORMS: ${{ matrix.platform }}
          TARGET_ARCHES: ${{ matrix.arches }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          OLKIL_PUBLISH: 'false'
          OLKIL_UPDATE_URL: https://updates.olkil.com

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: olkil-${{ matrix.platform }}-${{ matrix.arches }}
          path: |
            ide-electron/out/*.exe
            ide-electron/out/*.dmg
            ide-electron/out/*.deb
            ide-electron/out/*.AppImage
            ide-electron/out/*.yml
            ide-electron/out/*.blockmap
          if-no-files-found: warn

  release:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            V="${{ github.event.inputs.version }}"
            if [ -z "$V" ]; then
              # Prefer windows artifact version from filenames
              FILE=$(find artifacts -name 'OLKIL-*.exe' | head -n1 || true)
              if [ -n "$FILE" ]; then
                V=$(basename "$FILE" | sed -E 's/^OLKIL-([0-9.]+)\.exe$/\1/')
              else
                V="1.3.13"
              fi
            fi
            V="${V#v}"
            echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          fi
          echo "Release tag: $(cat $GITHUB_OUTPUT | grep tag)"

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.yml' -o -name '*.blockmap' \) -print -exec cp {} release/ \;
          ls -lah release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OLKIL ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
